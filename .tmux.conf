set-option -g default-shell /bin/zsh

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

set -g mouse on

#--Key Bindings------------------------------------------
# Reassign base command to Ctrl-Space
unbind C-b
set -g prefix C-Space

# More intuitive split keys
bind | split-window -h
bind - split-window -v

# Move between panes using vi keys hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
unbind l
bind l select-pane -R

# Keybindings to make resizing easier
bind -r C-h resize-pane -L
bind -r C-j resize-pane -D
bind -r C-k resize-pane -U
bind -r C-l resize-pane -R

# Move between tmux sessions
bind P switch-client -p
bind N switch-client -n
bind L switch-client -l

# Easily toggle synchronization (mnemonic: e is for echo)
bind e setw synchronize-panes on
bind E setw synchronize-panes off

# Reassign ; from last-pane to last-window
unbind \;
bind \; last-window

# Reassign ' from select-window to last-pane, and use ' for last-pane
unbind "'"
bind "'" last-pane
bind / command-prompt -p index "select-window -t ':%%'"

# agent-ask.nvim: split right, open nvim, forward origin pane id (Cmd+K via Ghostty → M-k)
bind -n M-k run-shell "tmux split-window -h \
  -t '#{pane_id}' \
  -c '#{pane_current_path}' \
  -e 'TMUX_ORIGIN_PANE_ID=#{pane_id}' \
  'nvim .'"

#--Status Bar-------------------------------------------
set -g status-left-length 100
set -g status-right-length 200
set -g status-justify centre

setenv -g TMUX_SHIP_LEFT_CONFIG "$HOME/.tmux/starship.toml"
setenv -g TMUX_SHIP_RIGHT_CONFIG "$HOME/.tmux/.right.toml"
setenv -g TMUX_SHIP_CENTER_CONFIG "$HOME/.tmux/.center.toml"

set -g status-style 'bg=black,fg=white'
set -g status-left '#(~/.cargo/bin/tmuxship left)'
set -g status-right '#(~/.cargo/bin/tmuxship right)'

set-hook -g client-session-changed 'refresh-client -S'
set-hook -g client-attached 'refresh-client -S'

set -g window-status-separator " • "
set -g window-status-style "bg=default,fg=default"
set -g window-status-format '#[fg=#6C7086]#I:#W#[default]'
set -g window-status-current-format '#[fg=#CDD6F4,bg=#313244,bold]#I:#W#[default]'

# Low idle interval for clock/long-running data
set -g status-interval 2

#--Usability--------------------------------------------
set-option -g status-keys vi
set-window-option -g mode-keys vi

# Keep tmux msgs around longer
set -g display-time 3000

setw -g automatic-rename on
#set-option -g set-titles on
#set-option -g set-titles-string '[#S:#I #H] #W'

# Enable clipboard integration (replaces old reattach-to-user-namespace workaround)
set -g set-clipboard on

set -g window-style 'bg=colour232'
set -g window-active-style 'bg=#282c34'

set -g extended-keys on
set -g extended-keys-format csi-u
