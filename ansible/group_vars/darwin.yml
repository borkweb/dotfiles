---
# Loaded by playbook.yml on macOS.
package_manager: homebrew

homebrew_taps:
  - raine/claude-code-proxy
  - peonping/tap

# CLI tools. This mirrors `brew leaves` on the primary machine.
homebrew_packages:
  # shell + terminal
  - bash
  - tmux
  - starship
  - eza
  - fd
  - fzf
  - the_silver_searcher
  - zoxide
  - htop
  - gum
  - shellcheck
  - wget
  # editors
  - neovim
  # git + github
  - gh
  - hub
  - subversion
  # languages + package managers
  - go
  - lua
  - php
  - php@8.3
  - pipx
  - pnpm
  - rbenv
  - ruby
  - rust
  - uv
  - yarn
  - cmake
  # web + wordpress dev
  - mariadb
  - mailpit
  - mkcert
  - proxychains-ng
  # media + documents
  - ffmpeg
  - imagemagick
  - pandoc
  - poppler
  - sox
  - whisper.cpp
  # ai coding tools
  - herdr
  - rtk
  - gemini-cli
  - raine/claude-code-proxy/claude-code-proxy
  - peonping/tap/peon-ping
  # misc
  - ansible
  - nushell
  - xcodegen

# Desktop apps. Pre-existing apps are left alone (accept_external_apps).
homebrew_cask_packages:
  - ghostty
  - google-chrome
  - visual-studio-code
  - phpstorm
  - tableplus
  - postman
  - docker-desktop
  - wordpresscom-studio
  - slack
  - obsidian
  - raycast
  - karabiner-elements
  - 1password
  - claude
  - codex
  - chatgpt
  - switchhosts
  - discord
  - spotify
  - zoom
  - loom
  - tailscale-app
  - cyberduck
